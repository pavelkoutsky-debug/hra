<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2f5c" />
    <meta name="description" content="Mostmistr: stavění mostů na technickém výkresu s poctivou fyzikou." />
    <title>Mostmistr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Náhled odkazu při sdílení. Stránka je jedna pro oba jazyky, proto je popis česky i anglicky.
      %ADRESA_WEBU% doplní sestavení z proměnné URL na Netlify (og:image musí být absolutní adresa).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mostmistr" />
    <meta property="og:title" content="Mostmistr" />
    <meta property="og:description" content="Stavěj mosty na technickém výkresu a vyzkoušej je poctivou fyzikou. · Build bridges on a technical drawing and test them with honest physics." />
    <meta property="og:url" content="%ADRESA_WEBU%/" />
    <meta property="og:image" content="%ADRESA_WEBU%/nahled.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Příhradový most na technickém výkresu ve hře Mostmistr" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/styly.css" />
  </head>
  <body>
    <noscript>
      <p class="bez-skriptu">
        Mostmistr je hra o stavění mostů a bez JavaScriptu se nespustí: povol ho prosím a načti stránku znovu.
        <span lang="en">Mostmistr is a bridge-building game and needs JavaScript: please enable it and reload the page.</span>
      </p>
    </noscript>
    <!-- Přehled kampaně -->
    <div class="hra hra--prehled" id="obrazovka-prehled" hidden>
      <header class="lista">
        <span class="lista__nazev" data-text="hra.nazev"></span>
        <span class="lista__oddil" data-text="prehled.nadpis"></span>
        <span class="lista__mezera"></span>
        <button type="button" class="tlacitko" data-akce="jazyk"></button>
        <a class="tlacitko" href="?sandbox=1" data-akce="otevrit-sandbox" data-text="prehled.sandbox" data-popis="prehled.sandbox.popis"></a>
        <button type="button" class="tlacitko" data-akce="vazba" data-text="vazba.tlacitko" data-popis="vazba.tlacitko.popis"></button>
      </header>
      <main class="prehled">
        <p class="prehled__hlaseni" data-udaj="prehled-hlaseni" role="alert" hidden></p>
        <!-- Začátek: nový hráč rovnou do první úrovně, vracející se do úrovně, kde skončil. -->
        <p class="prehled__start" data-udaj="prehled-start" hidden>
          <a class="tlacitko tlacitko--hlavni prehled__start-tlacitko" data-akce="prehled-start"></a>
        </p>
        <p class="prehled__postup" data-udaj="prehled-postup"></p>
        <p class="prehled__dokonceno" data-udaj="prehled-dokonceno" role="status" hidden></p>
        <p class="prehled__list"><a href="?list" data-akce="otevrit-list" data-udaj="prehled-list"></a></p>
        <div class="zaznam" data-udaj="zaznam-upozorneni" role="note" hidden>
          <span data-text="denik.upozorneni"></span>
          <a href="?soukromi" data-akce="soukromi" data-text="soukromi.vice"></a>
          <button type="button" class="tlacitko" data-akce="zaznam-rozumim" data-text="denik.rozumim"></button>
          <button type="button" class="tlacitko" data-akce="zaznam-vypnout" data-text="denik.vypnout"></button>
        </div>
        <div class="prehled__kapitoly"></div>
        <!-- Havarijní komise: případy mimo kampaň (cizí most, který spadl, a oprava pár změnami). -->
        <section class="komise" data-udaj="prehled-komise" hidden></section>
        <!-- Odemknutí všech úrovní je pomůcka pro zkoušení hry: ukáže se jen s ?vyvoj=1 v adrese. -->
        <label class="prehled__volba" data-jen-vyvoj hidden>
          <input type="checkbox" id="odemknout-vse" />
          <span data-text="prehled.odemknout"></span>
        </label>
        <label class="prehled__volba">
          <input type="checkbox" id="zaznam-hrani" />
          <span data-text="denik.volba"></span>
        </label>
        <p class="prehled__verze">
          <span data-udaj="prehled-verze"></span>
          · <a href="/zkusebna.html" data-text="lista.zkusebna" data-popis="lista.zkusebna.popis"></a>
          · <a href="?soukromi" data-akce="soukromi" data-text="soukromi.odkaz"></a>
        </p>
      </main>
    </div>

    <!-- Závěrečný list: souhrn kampaně a galerie mostů hráče -->
    <div class="hra hra--prehled" id="obrazovka-list" hidden>
      <header class="lista">
        <span class="lista__nazev" data-text="hra.nazev"></span>
        <span class="lista__oddil" data-udaj="list-oddil"></span>
        <span class="lista__mezera"></span>
        <button type="button" class="tlacitko" data-akce="list-obrazek" data-text="list.stahnout" data-popis="list.stahnout.popis"></button>
        <a class="tlacitko" href="/" data-text="lista.kampan"></a>
      </header>
      <main class="prehled list">
        <section class="list__zahlavi">
          <h1 data-udaj="list-nadpis"></h1>
          <p class="list__veta" data-udaj="list-veta"></p>
          <dl class="list__cisla" data-udaj="list-cisla"></dl>
          <p class="list__hlaseni" data-udaj="list-hlaseni" role="status"></p>
        </section>
        <div class="prehled__kapitoly" data-udaj="list-kapitoly"></div>
        <p class="list__poznamka" data-udaj="list-poznamka" hidden></p>
        <canvas data-udaj="list-platno" hidden></canvas>
      </main>
    </div>

    <!-- Obrazovka úrovně -->
    <div class="hra" id="obrazovka-uroven" hidden>
      <header class="lista">
        <a class="lista__nazev" href="/" data-text="hra.nazev"></a>
        <span class="lista__uroven" data-udaj="uroven"></span>
        <span class="lista__id" data-udaj="uroven-id"></span>

        <div class="rozpocet">
          <span class="rozpocet__popis" data-udaj="rozpocet-popis"></span>
          <span class="rozpocet__pruh">
            <span class="rozpocet__plneni"></span>
            <span class="rozpocet__ryska" data-popis="rozpocet.inzenyrsky" hidden>
              <span data-text="rozpocet.inz"></span>
            </span>
          </span>
          <output class="rozpocet__castka" data-udaj="rozpocet"></output>
        </div>

        <button
          type="button"
          class="tlacitko tlacitko--hlavni"
          data-akce="zkouska"
          data-popis="zkouska.popisTlacitka"
        ></button>

        <span class="lista__mezera"></span>
        <button type="button" class="tlacitko" data-akce="zvuk" data-popis="zvuk.popis" aria-pressed="true"></button>
        <button type="button" class="tlacitko lista__vazba" data-akce="vazba" data-text="vazba.tlacitko" data-popis="vazba.tlacitko.popis"></button>
        <a class="tlacitko" href="/" data-text="lista.kampan"></a>
        <!-- Telefon: Zpět a Smazat jsou v paletě pod okrajem okna, proto jsou i tady. -->
        <button type="button" class="tlacitko tlacitko--znak lista__telefon" data-akce="zpet-rychle" data-popis="paleta.zpet.popis" data-jen="stavba">↩</button>
        <button type="button" class="tlacitko tlacitko--znak lista__telefon" data-akce="smazat-rychle" data-popis="paleta.smazat.popis" data-jen="stavba">Del</button>
        <button type="button" class="tlacitko tlacitko--znak" data-akce="oddalit" data-popis="lista.oddalit">&minus;</button>
        <button type="button" class="tlacitko tlacitko--znak" data-akce="priblizit" data-popis="lista.priblizit">+</button>
        <button type="button" class="tlacitko" data-akce="cely-vykres" data-text="lista.celyVykres" data-kratce-text="lista.celyVykres.kratce"></button>
      </header>
      <!-- Vedený první krok: v první úrovni s hotovou mostovkou, dokud hráč nepustil zkoušku. -->
      <p class="vyzva-zkousky" data-udaj="vyzva-zkousky" data-text="vedeni.zkouska" role="status" hidden></p>

      <!--
        Most otevřený z odkazu: vlastní most hráče je stranou a nic se neukládá, dokud se
        nerozhodne. Vlastní řádek pod lištou, ne přes výkres: cizí most má být celý vidět.
      -->
      <!--
        Havarijní komise: pruh s počtem změn opravy. Vlastní řádek pod lištou, ne přes výkres;
        zůstává i při zkoušce, aby plátno při jejím spuštění nezměnilo výšku.
      -->
      <div class="host host--komise" data-udaj="komise" role="status" hidden>
        <p class="host__text" data-udaj="komise-text"></p>
        <div class="host__tlacitka">
          <button type="button" class="tlacitko" data-akce="komise-spis" data-text="komise.spis" data-popis="komise.spis.popis"></button>
          <button type="button" class="tlacitko" data-akce="komise-puvodni" data-text="komise.puvodni" data-popis="komise.puvodni.popis"></button>
        </div>
      </div>
      <div class="host" data-udaj="host" role="status" hidden>
        <p class="host__text" data-udaj="host-text"></p>
        <div class="host__tlacitka">
          <button type="button" class="tlacitko tlacitko--hlavni" data-akce="host-prekonat" data-text="sdileni.host.prekonat" data-popis="sdileni.host.prekonat.popis"></button>
          <button type="button" class="tlacitko" data-akce="host-nechat"></button>
          <button type="button" class="tlacitko" data-akce="host-ulozit" data-text="dilna.host.ulozit" data-popis="dilna.host.ulozit.popis" hidden></button>
          <button type="button" class="tlacitko" data-akce="host-zpet"></button>
        </div>
        <!-- Kdo přijde odkazem, zadání neotevírá: upozornění na záznam hraní má vidět tady. -->
        <div class="zaznam zaznam--host" data-udaj="zaznam-upozorneni" role="note" hidden>
          <span data-text="denik.upozorneni"></span>
          <a href="?soukromi" data-akce="soukromi" data-text="soukromi.vice"></a>
          <button type="button" class="tlacitko" data-akce="zaznam-rozumim" data-text="denik.rozumim"></button>
          <button type="button" class="tlacitko" data-akce="zaznam-vypnout" data-text="denik.vypnout"></button>
        </div>
      </div>

      <div class="uroven">
        <aside class="paleta">
          <!-- Zadání, nápověda a nastavení pískoviště jsou nahoře: na dlouhé paletě by jinak byly pod okrajem okna. -->
          <div class="paleta__dvojice paleta__uvod">
            <button type="button" class="paleta__tlacitko" data-akce="zadani" data-popis="paleta.zadaniOkno.popis">
              <span data-text="paleta.zadaniOkno"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="napoveda" data-popis="napoveda.tlacitko.popis" hidden>
              <span data-text="napoveda.tlacitko"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="sandbox" data-popis="sandbox.tlacitko.popis" hidden>
              <span data-text="sandbox.tlacitko"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="dilna" data-popis="dilna.tlacitko.popis" hidden>
              <span data-text="dilna.tlacitko"></span>
            </button>
          </div>
          <!-- Nástroje jsou hned pod zadáním: na dlouhé paletě (lana, pískoviště) by jinak byly až pod okrajem okna. -->
          <h2 data-text="paleta.nastroje"></h2>
          <div class="paleta__dvojice paleta__nastroje">
            <button type="button" class="paleta__tlacitko" data-akce="vyber" data-popis="paleta.vyber.popis" aria-pressed="false">
              <kbd>V</kbd><span data-text="paleta.vyber"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="zrcadlit" data-popis="paleta.zrcadlit.popis">
              <kbd>M</kbd><span data-text="paleta.zrcadlit"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="smazat" data-popis="paleta.smazat.popis">
              <kbd>Del</kbd><span data-text="paleta.smazat"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="smazat-vse" data-popis="paleta.smazatVse.popis">
              <span data-text="paleta.smazatVse"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="zpet" data-popis="paleta.zpet.popis">
              <span data-text="paleta.zpet"></span>
            </button>
            <button type="button" class="paleta__tlacitko" data-akce="znovu" data-popis="paleta.znovu.popis">
              <span data-text="paleta.znovu"></span>
            </button>
          </div>
          <h2 data-text="paleta.prvky"></h2>
          <div class="paleta__prvky"></div>
          <button type="button" class="paleta__tlacitko paleta__tlacitko--prvek paleta__tlacitko--akce" data-akce="dopnout" data-popis="paleta.dopnout.popis" hidden>
            <kbd>N</kbd><span class="paleta__nazev" data-text="paleta.dopnout"></span>
            <span class="paleta__cena" data-text="paleta.dopnout.kratce"></span>
          </button>

          <div class="paleta__skupina" data-cast="pokusy" hidden>
            <h2 data-text="paleta.pokusy"></h2>
            <div class="paleta__pokusy">
              <button type="button" class="paleta__tlacitko paleta__tlacitko--prvek" data-akce="brnknout" data-popis="paleta.brnknout.popis" aria-pressed="false" hidden>
                <kbd>B</kbd><span class="paleta__nazev" data-text="paleta.brnknout"></span>
                <span class="paleta__cena" data-text="paleta.brnknout.kratce"></span>
              </button>
              <button type="button" class="paleta__tlacitko paleta__tlacitko--prvek" data-akce="budic" data-popis="paleta.budic.popis" aria-pressed="false" hidden>
                <kbd>U</kbd><span class="paleta__nazev" data-text="paleta.budic"></span>
                <span class="paleta__cena" data-text="paleta.budic.kratce"></span>
              </button>
              <button type="button" class="paleta__tlacitko paleta__tlacitko--prvek" data-akce="zlom" data-popis="paleta.zlom.popis">
                <kbd>D</kbd><span class="paleta__nazev" data-text="paleta.zlom"></span>
                <span class="paleta__cena" data-text="paleta.zlom.kratce"></span>
              </button>
            </div>
          </div>

          <div class="paleta__nastaveni-obal">
          <div class="paleta__nastaveni" data-nastaveni="vyber" hidden>
            <h2 data-udaj="vyber-nadpis"></h2>
            <p class="paleta__poznamka" data-udaj="vyber-udaje"></p>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="zavazi" hidden>
            <h2 data-text="paleta.zavazi"></h2>
            <div class="paleta__krokovac">
              <button type="button" class="paleta__tlacitko" data-akce="zavazi-min" data-popis="paleta.zavazi.min">&minus;</button>
              <output data-udaj="zavazi"></output>
              <button type="button" class="paleta__tlacitko" data-akce="zavazi-plus" data-popis="paleta.zavazi.plus">+</button>
            </div>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="budic" hidden>
            <h2 data-text="paleta.budic.rytmus"></h2>
            <div class="paleta__krokovac">
              <button type="button" class="paleta__tlacitko" data-akce="budic-min" data-popis="paleta.budic.niz">&minus;</button>
              <output data-udaj="budic-rytmus"></output>
              <button type="button" class="paleta__tlacitko" data-akce="budic-plus" data-popis="paleta.budic.vys">+</button>
            </div>
            <button type="button" class="paleta__tlacitko" data-akce="budic-rozsah" data-popis="paleta.budic.rozsah.popis" aria-pressed="true">
              <span data-text="paleta.budic.rozsah"></span>
            </button>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="ladeny" hidden>
            <h2 data-text="paleta.ladeny"></h2>
            <button type="button" class="paleta__tlacitko" data-akce="ladeny-prepnout" data-popis="paleta.ladeny.popis" aria-pressed="false">
              <kbd>L</kbd><span data-udaj="ladeny-prepnout"></span>
            </button>
            <div class="paleta__krokovac" data-cast="ladeny-hmota">
              <button type="button" class="paleta__tlacitko" data-akce="ladeny-hmota-min" data-popis="paleta.ladeny.lehci">&minus;</button>
              <output data-udaj="ladeny-hmota"></output>
              <button type="button" class="paleta__tlacitko" data-akce="ladeny-hmota-plus" data-popis="paleta.ladeny.tezsi">+</button>
            </div>
            <div class="paleta__krokovac" data-cast="ladeny-frekvence">
              <button type="button" class="paleta__tlacitko" data-akce="ladeny-frekvence-min" data-popis="paleta.ladeny.niz">&minus;</button>
              <output data-udaj="ladeny-frekvence"></output>
              <button type="button" class="paleta__tlacitko" data-akce="ladeny-frekvence-plus" data-popis="paleta.ladeny.vys">+</button>
            </div>
            <p class="paleta__poznamka" data-udaj="ladeny-cil" hidden></p>
            <button type="button" class="paleta__tlacitko" data-akce="ladeny-naladit" data-popis="paleta.ladeny.naladit.popis" hidden>
              <span data-text="paleta.ladeny.naladit"></span>
            </button>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="predpeti" hidden>
            <h2 data-text="paleta.napinak"></h2>
            <div class="paleta__krokovac">
              <button type="button" class="paleta__tlacitko" data-akce="predpeti-min" data-popis="paleta.napinak.min">&minus;</button>
              <output data-udaj="predpeti"></output>
              <button type="button" class="paleta__tlacitko" data-akce="predpeti-plus" data-popis="paleta.napinak.plus">+</button>
            </div>
            <p class="paleta__poznamka" data-udaj="predpeti-tah"></p>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="svar" hidden>
            <h2 data-text="paleta.svar"></h2>
            <button type="button" class="paleta__tlacitko" data-akce="svar-prepnout" data-popis="paleta.svar.popis" aria-pressed="false">
              <kbd>S</kbd><span data-udaj="svar-prepnout"></span>
            </button>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="zamek" hidden>
            <h2 data-text="paleta.zamek"></h2>
            <button type="button" class="paleta__tlacitko" data-akce="zamek-prepnout" data-popis="paleta.zamek.popis" aria-pressed="false">
              <span data-udaj="zamek-prepnout"></span>
            </button>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="zdvih" hidden>
            <h2 data-text="paleta.zdvih"></h2>
            <div class="paleta__krokovac">
              <button type="button" class="paleta__tlacitko" data-akce="zdvih-min" data-popis="paleta.zdvih.min">&minus;</button>
              <output data-udaj="zdvih"></output>
              <button type="button" class="paleta__tlacitko" data-akce="zdvih-plus" data-popis="paleta.zdvih.plus">+</button>
            </div>
            <p class="paleta__poznamka" data-udaj="zdvih-poznamka"></p>
          </div>
          <div class="paleta__nastaveni" data-nastaveni="tlumeni" hidden>
            <h2 data-text="paleta.tlumeni"></h2>
            <div class="paleta__krokovac">
              <button type="button" class="paleta__tlacitko" data-akce="tlumeni-min" data-popis="paleta.tlumeni.min">&minus;</button>
              <output data-udaj="tlumeni"></output>
              <button type="button" class="paleta__tlacitko" data-akce="tlumeni-plus" data-popis="paleta.tlumeni.plus">+</button>
            </div>
          </div>
          </div>

          <h2 data-text="paleta.most"></h2>
          <div class="paleta__dvojice">
            <button type="button" class="paleta__tlacitko" data-akce="export"><span data-text="paleta.export"></span></button>
            <button type="button" class="paleta__tlacitko" data-akce="import"><span data-text="paleta.import"></span></button>
          </div>
          <!-- Sdílení mostu odkazem: jen v kampani (údolí z pískoviště odkaz nenese). -->
          <button type="button" class="paleta__tlacitko paleta__tlacitko--siroke" data-akce="sdilet" data-popis="sdileni.tlacitko.popis" data-jen-kampan>
            <span data-text="sdileni.tlacitko"></span>
          </button>
          <!-- Žebříček úrovně: tři měřítka, mosty všech hráčů ověřené serverem. -->
          <button type="button" class="paleta__tlacitko paleta__tlacitko--siroke" data-akce="zebricek" data-popis="zebricek.tlacitko.popis" data-jen-kampan>
            <span data-text="zebricek.tlacitko"></span>
          </button>
          <div class="paleta__vyzva" data-udaj="vyzva-odkazu" data-jen-kampan hidden>

        <p class="okno__hlaseni" data-udaj="sandbox-hlaseni" role="status"></p>
        <div class="okno__tlacitka">
          <button type="button" class="tlacitko tlacitko--hlavni" data-akce="sandbox-pouzit" data-text="sandbox.pouzit"></button>
          <button class="tlacitko" value="zavrit" data-text="okno.zavrit"></button>
        </div>
      </form>
    </dialog>

    <dialog class="okno okno--dilna" id="okno-dilna">
      <form method="dialog">
        <h2 data-text="dilna.nadpis"></h2>
        <div class="dilna__obsah">
          <p data-text="dilna.popis"></p>
          <div class="dilna__ulozit">
            <label for="dilna-nazev" data-text="dilna.nazev"></label>
            <input type="text" id="dilna-nazev" maxlength="40" autocomplete="off" />
            <button type="button" class="tlacitko tlacitko--hlavni" data-akce="dilna-ulozit" data-text="dilna.ulozit"></button>
          </div>
          <div class="dilna__odkaz">
            <label for="dilna-odkaz" data-text="dilna.odkaz"></label>
            <input type="text" id="dilna-odkaz" readonly />
            <button type="button" class="tlacitko" data-akce="dilna-kopirovat" data-text="dilna.kopirovat"></button>
          </div>
          <p class="okno__hlaseni" data-udaj="dilna-hlaseni" role="status"></p>
          <h3 data-udaj="dilna-pocet"></h3>
          <p class="okno__poznamka" data-udaj="dilna-prazdno" data-text="dilna.prazdno" hidden></p>
          <ul class="dilna__prace" data-udaj="dilna-prace"></ul>
        </div>
        <div class="okno__tlacitka">
          <button class="tlacitko" value="zavrit" data-text="okno.zavrit"></button>
        </div>
      </form>
    </dialog>

    <dialog class="okno okno--zebricek" id="okno-zebricek">
      <form method="dialog">
        <h2><span data-text="zebricek.nadpis"></span> · <span data-udaj="zebricek-uroven"></span></h2>
        <p class="okno__poznamka" data-text="zebricek.popis"></p>
        <!-- Posouvá se jen seznam řádků: přezdívka, tlačítko a hlášení zůstávají vidět. -->
        <div class="zebricek__obsah">
          <div class="zebricek__tabulky" data-udaj="zebricek-tabulky"></div>
        </div>
        <div class="zebricek__zapis">
          <label for="zebricek-jmeno" data-text="zebricek.jmeno"></label>
          <input type="text" id="zebricek-jmeno" autocomplete="nickname" />
          <button type="button" class="tlacitko tlacitko--hlavni" data-akce="zebricek-zapsat" data-text="zebricek.zapsat"></button>
        </div>
        <p class="okno__hlaseni" data-udaj="zebricek-hlaseni" role="status"></p>
        <p class="okno__poznamka">
          <span data-text="zebricek.soukromi"></span>
          <a href="?soukromi" data-akce="soukromi" data-text="soukromi.vice"></a>
        </p>
        <div class="okno__tlacitka">
          <button class="tlacitko" value="zavrit" data-text="okno.zavrit"></button>
        </div>
      </form>
    </dialog>

    <dialog class="okno okno--vazba" id="okno-vazba">
      <form method="dialog">
        <h2 data-text="vazba.nadpis"></h2>
        <p data-text="vazba.uvod"></p>
        <fieldset class="vazba__druhy">
          <legend data-text="vazba.druh"></legend>
          <label><input type="radio" name="vazba-druh" value="chyba" checked /> <span data-text="vazba.druh.chyba"></span></label>
          <label><input type="radio" name="vazba-druh" value="obtiznost" /> <span data-text="vazba.druh.obtiznost"></span></label>
          <label><input type="radio" name="vazba-druh" value="napad" /> <span data-text="vazba.druh.napad"></span></label>
          <label><input type="radio" name="vazba-druh" value="pochvala" /> <span data-text="vazba.druh.pochvala"></span></label>
          <label><input type="radio" name="vazba-druh" value="jine" /> <span data-text="vazba.druh.jine"></span></label>
        </fieldset>
        <label class="vazba__popisek" for="vazba-text" data-text="vazba.text"></label>
        <textarea id="vazba-text" rows="6" autocomplete="off"></textarea>
        <p class="vazba__pocet" data-udaj="vazba-pocet"></p>
        <div class="vazba__hodnoceni">
          <span data-text="vazba.hodnoceni"></span>
          <span class="vazba__kraj" data-text="vazba.hodnoceni.malo"></span>
          <button type="button" class="tlacitko tlacitko--znak" data-hodnoceni="1" aria-pressed="false">1</button>
          <button type="button" class="tlacitko tlacitko--znak" data-hodnoceni="2" aria-pressed="false">2</button>
          <button type="button" class="tlacitko tlacitko--znak" data-hodnoceni="3" aria-pressed="false">3</button>
          <button type="button" class="tlacitko tlacitko--znak" data-hodnoceni="4" aria-pressed="false">4</button>
          <button type="button" class="tlacitko tlacitko--znak" data-hodnoceni="5" aria-pressed="false">5</button>
          <span class="vazba__kraj" data-text="vazba.hodnoceni.moc"></span>
        </div>
        <label class="vazba__volba">
          <input type="checkbox" id="vazba-prilohy" checked />
          <span data-udaj="vazba-prilohy"></span>
        </label>
        <label class="vazba__popisek" for="vazba-kontakt" data-text="vazba.kontakt"></label>
        <input id="vazba-kontakt" type="email" maxlength="200" autocomplete="email" />
        <p class="vazba__poznamka">
          <span data-text="vazba.kontakt.poznamka"></span>
          <a href="?soukromi" data-akce="soukromi" data-text="soukromi.vice"></a>
        </p>
        <input id="vazba-web" class="vazba__past" type="text" name="potvrzeni-zpravy" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <p class="vazba__zaznam">
          <span data-udaj="vazba-zaznam"></span>
          <button type="button" class="tlacitko" data-akce="vazba-zaznam"></button>
        </p>
        <p class="okno__hlaseni" data-udaj="vazba-hlaseni" role="status"></p>
        <div class="okno__tlacitka">
          <button type="submit" class="tlacitko tlacitko--hlavni" value="odeslat" data-akce="vazba-odeslat" data-text="vazba.odeslat"></button>
          <button class="tlacitko" value="zavrit" formnovalidate data-text="okno.zavrit"></button>
        </div>
      </form>
    </dialog>

    <dialog class="okno okno--zadani" id="okno-zadani">
      <form method="dialog">
        <p class="okno__nadtitul" data-udaj="zadani-list"></p>
        <h2 data-udaj="zadani-nazev"></h2>
        <div class="okno__telo">
          <div class="okno__hlavni">
            <p class="okno__zadani" data-udaj="zadani-text"></p>
            <p class="okno__zkouska" data-udaj="zadani-zkouska" data-text="zadani.zkouska.bez" hidden></p>
            <section class="ukazka" data-udaj="ukazka" hidden>
              <h3 data-text="ukazka.nadpis"></h3>
              <div class="ukazka__strany">
                <figure class="ukazka__strana" data-strana="a">
                  <canvas></canvas>
                  <figcaption><span data-udaj="ukazka-a"></span><output data-stav></output></figcaption>
                </figure>
                <figure class="ukazka__strana" data-strana="b">
                  <canvas></canvas>
                  <figcaption><span data-udaj="ukazka-b"></span><output data-stav></output></figcaption>
                </figure>
              </div>
              <p class="ukazka__popis"><span data-udaj="ukazka-popis"></span> <span class="ukazka__poznamka" data-poznamka></span></p>
            </section>
            <!-- Zadání jsou dvě věty a ukázka; vysvětlení a souvislosti si hráč rozbalí. -->
            <details class="okno__vice" data-udaj="zadani-vice-obal">
              <summary data-text="zadani.vice"></summary>
              <p class="okno__zadani okno__zadani--vice" data-udaj="zadani-vice" hidden></p>
              <p class="okno__skutecnost" data-udaj="zadani-skutecnost" hidden></p>
            </details>
          </div>
          <div class="okno__vedlejsi">
            <!-- Medaile jsou cíl úrovně: stojí nahoře, ať nejsou v dlouhém zadání pod okrajem okna. -->
            <h3 data-text="zadani.medaile" data-jen-kampan></h3>
            <ul class="medaile" data-udaj="zadani-medaile" data-jen-kampan></ul>
            <h3 data-text="zadani.provoz"></h3>
            <ul class="okno__seznam" data-udaj="zadani-provoz"></ul>
            <!-- Prvky a ceny ukazuje i paleta, výzvy jsou až pro projitou úroveň: obojí sbalené. -->
            <details class="okno__vice" data-cast="zadani-stavba">
              <summary><span data-text="zadani.stavba"></span> <span class="okno__souhrn" data-udaj="zadani-stavba-souhrn"></span></summary>
              <ul class="okno__seznam" data-udaj="zadani-stavba"></ul>
            </details>
            <details class="okno__vice" data-cast="zadani-vyzvy">
              <summary data-text="vyzvy.nadpis"></summary>
              <p class="okno__poznamka" data-text="vyzvy.uvod"></p>
              <ul class="okno__seznam" data-udaj="zadani-vyzvy"></ul>
            </details>
          </div>
        </div>
        <div class="zaznam zaznam--vOkne" data-udaj="zaznam-upozorneni" role="note" hidden>
          <span data-text="denik.upozorneni"></span>
          <a href="?soukromi" data-akce="soukromi" data-text="soukromi.vice"></a>
          <button type="button" class="tlacitko" data-akce="zaznam-rozumim" data-text="denik.rozumim"></button>
          <button type="button" class="tlacitko" data-akce="zaznam-vypnout" data-text="denik.vypnout"></button>
        </div>
        <p class="okno__napoveda" data-udaj="zadani-ovladani" data-text="zadani.ovladani"></p>
        <div class="okno__tlacitka">
          <button class="tlacitko tlacitko--hlavni" value="zavrit" data-text="zadani.zacit"></button>
        </div>
      </form>
    </dialog>

    <dialog class="okno okno--pojmy okno--soukromi" id="okno-soukromi">
      <form method="dialog">
        <h2 data-text="soukromi.nadpis"></h2>
        <p data-text="soukromi.uvod"></p>
        <h3 data-text="soukromi.prohlizec.nadpis"></h3>
        <p data-text="soukromi.prohlizec"></p>
        <h3 data-text="soukromi.denik.nadpis"></h3>
        <p data-text="soukromi.denik"></p>
        <p class="soukromi__radek">
          <span data-udaj="soukromi-zaznam"></span>
          <button type="button" class="tlacitko" data-akce="soukromi-zaznam"></button>
        </p>
        <h3 data-text="soukromi.vazba.nadpis"></h3>
        <p data-text="soukromi.vazba"></p>
        <h3 data-text="soukromi.zebricek.nadpis"></h3>
        <p data-text="soukromi.zebricek"></p>
        <h3 data-text="soukromi.kde.nadpis"></h3>
        <p data-text="soukromi.kde"></p>
        <h3 data-text="soukromi.smazani.nadpis"></h3>
        <p data-text="soukromi.smazani"></p>
        <p class="soukromi__radek">
          <span data-text="soukromi.hrac"></span>
          <code class="soukromi__hrac" data-udaj="soukromi-hrac"></code>
          <button type="button" class="tlacitko" data-akce="soukromi-kopirovat"></button>
        </p>
        <p class="soukromi__radek" data-udaj="soukromi-zebricek-radek" hidden>
          <span data-text="soukromi.hrac.zebricek"></span>
          <code class="soukromi__hrac" data-udaj="soukromi-zebricek"></code>
        </p>
        <div class="okno__tlacitka">
          <button type="button" class="tlacitko" data-akce="soukromi-napis" data-text="soukromi.napis"></button>
          <button class="tlacitko tlacitko--hlavni" value="zavrit" data-text="okno.zavrit"></button>
        </div>
      </form>
    </dialog>

    <dialog class="okno okno--pojmy" id="okno-pojmy">
      <form method="dialog">
        <h2 data-text="pojmy.nadpis"></h2>
        <p class="okno__poznamka" data-text="pojmy.uvod"></p>
        <dl class="pojmy" data-udaj="pojmy-seznam"></dl>
        <div class="okno__tlacitka">
          <button class="tlacitko tlacitko--hlavni" value="zavrit" data-text="okno.zavrit"></button>
        </div>
      </form>
    </dialog>

    <!-- Vysvětlení pojmu, na který hráč klikl v textu; popover leží i nad otevřeným oknem. -->
    <div class="pojem-bublina" id="pojem-bublina" popover role="note">
      <strong data-udaj="pojem-nazev"></strong>
      <span data-udaj="pojem-text"></span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
