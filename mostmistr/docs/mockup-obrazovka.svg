  <rect width="1280" height="720" fill="url(#g5)"/>
  <rect x="8" y="8" width="1264" height="704" fill="none" stroke="#cfe3ff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- horní lišta -->
  <g>
    <rect x="8" y="8" width="1264" height="46" fill="#0b2f5c" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <text x="26" y="38" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="3">MOSTMISTR</text>
    <text x="180" y="37" fill="#cfe3ff" font-size="13">5-02  Lávka u jezu</text>
    <text x="420" y="37" fill="#cfe3ff" font-size="13">Rozpočet</text>
    <rect x="496" y="24" width="180" height="14" fill="none" stroke="#cfe3ff"/>
    <rect x="496" y="24" width="133" height="14" fill="#8fd0ff" fill-opacity="0.75"/>
    <!-- ryska inženýrského rozpočtu -->
    <line x1="640" y1="19" x2="640" y2="43" stroke="#ffffff" stroke-width="2"/>
    <text x="640" y="17" fill="#ffffff" font-size="9" text-anchor="middle">inž.</text>
    <text x="688" y="37" fill="#ffffff" font-size="13">184 500 / 250 000 Kč</text>
    <g font-size="13">
      <rect x="900" y="18" width="104" height="26" rx="2" fill="none" stroke="#cfe3ff"/>
      <text x="952" y="36" fill="#cfe3ff" text-anchor="middle">Analýza</text>
      <rect x="1014" y="18" width="124" height="26" rx="2" fill="#e6eefc"/>
      <text x="1076" y="36" fill="#0b2f5c" text-anchor="middle" font-weight="bold">▶ Zkouška</text>
      <rect x="1148" y="18" width="110" height="26" rx="2" fill="none" stroke="#cfe3ff"/>
      <text x="1203" y="36" fill="#cfe3ff" text-anchor="middle">¼× 1× 4×</text>
    </g>
  </g>

  <!-- paleta: jen prvky odemčené v kapitole 5 -->
  <g font-size="12" fill="#cfe3ff">
    <rect x="8" y="54" width="132" height="658" fill="#0b2f5c" fill-opacity="0.85" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <text x="22" y="78" font-size="11" letter-spacing="2" fill="#8fb4e6">PRVKY</text>
    <g>
      <rect x="18" y="88" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <line x1="26" y1="104" x2="52" y2="104" stroke="#ffffff" stroke-width="5"/>
      <text x="60" y="108">Mostovka</text>
    </g>
    <g>
      <rect x="18" y="126" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <line x1="26" y1="142" x2="52" y2="142" stroke="#e8c690" stroke-width="3"/>
      <text x="60" y="146">Dřevo</text>
    </g>
    <g>
      <rect x="18" y="164" width="112" height="32" fill="#1d5aa3" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="26" y1="180" x2="52" y2="180" stroke="#ffffff" stroke-width="3"/>
      <text x="60" y="184" fill="#ffffff">Ocel</text>
    </g>
    <g>
      <rect x="18" y="202" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <line x1="26" y1="218" x2="52" y2="218" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="5 2"/>
      <text x="60" y="222">Lano</text>
    </g>
    <g>
      <rect x="18" y="240" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="30" y="245" width="18" height="22" fill="url(#srafy)" stroke="#cfe3ff"/>
      <text x="60" y="260">Pilíř</text>
    </g>
    <g>
      <rect x="18" y="278" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <path d="M26 294h8m0-6v12m4-12v12m-4-12h10m-10 12h10m-6-6h10" fill="none" stroke="#cfe3ff" stroke-width="1.5"/>
      <text x="60" y="298">Tlumič</text>
    </g>
    <g>
      <rect x="18" y="316" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="31" y="324" width="16" height="16" fill="none" stroke="#cfe3ff" stroke-width="1.5"/>
      <path d="M31 324l16 16m0-16l-16 16" stroke="#cfe3ff" stroke-width="1"/>
      <text x="60" y="336">Závaží</text>
    </g>
    <g>
      <rect x="18" y="354" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <path d="M39 358v4l-5 2 10 4-10 4 10 4-5 2v2" fill="none" stroke="#cfe3ff" stroke-width="1.3"/>
      <text x="54" y="374" font-size="11">Lad. tlumič</text>
    </g>
    <text x="22" y="416" font-size="11" letter-spacing="2" fill="#8fb4e6">STYČNÍK</text>
    <g>
      <rect x="18" y="426" width="112" height="32" fill="#1d5aa3" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="39" cy="442" r="6" fill="#103f78" stroke="#ffffff" stroke-width="1.5"/>
      <text x="60" y="446" fill="#ffffff">Kloub</text>
    </g>
    <g>
      <rect x="18" y="464" width="112" height="32" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="33" y="474" width="12" height="12" fill="#cfe3ff"/>
      <text x="60" y="484">Svar</text>
    </g>
    <text x="22" y="526" font-size="11" letter-spacing="2" fill="#8fb4e6">NÁSTROJE</text>
    <text x="22" y="548">Výběr        V</text>
    <text x="22" y="568">Mazat      Del</text>
    <text x="22" y="588">Zrcadlit     M</text>
    <text x="22" y="608">Zpět    Ctrl+Z</text>
    <text x="22" y="628">Brnknout     B</text>
    <text x="22" y="648">Zkouška  mezer.</text>
  </g>

  <!-- legenda využití -->
  <g font-size="11" fill="#cfe3ff">
    <text x="160" y="82">VYUŽITÍ</text>
    <rect x="220" y="72" width="30" height="10" fill="#ffffff"/><rect x="250" y="72" width="30" height="10" fill="#ffe9a8"/><rect x="280" y="72" width="30" height="10" fill="#ffd166"/><rect x="310" y="72" width="30" height="10" fill="#ff9a4d"/><rect x="340" y="72" width="30" height="10" fill="#ff4d3d"/>
    <text x="220" y="98" font-size="10">0 %</text><text x="344" y="98" font-size="10">100 %</text>
    <line x1="400" y1="77" x2="436" y2="77" stroke="#ffffff" stroke-width="4"/>
    <text x="444" y="81">tlak</text>
    <line x1="490" y1="77" x2="526" y2="77" stroke="#ffffff" stroke-width="5"/>
    <line x1="490" y1="77" x2="526" y2="77" stroke="#103f78" stroke-width="1.6"/>
    <text x="534" y="81">tah</text>
  </g>

  <!-- terén v řezu -->
  <g>
    <path d="M140 400 H300 L330 470 L352 600 L372 712 H140 Z" fill="url(#srafy)" stroke="#cfe3ff" stroke-width="1.5"/>
    <path d="M1000 712 L960 600 L948 470 L940 400 H1000 Z" fill="url(#srafy)" stroke="#cfe3ff" stroke-width="1.5"/>
    <path d="M352 600 q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 l8 0" fill="none" stroke="#8fd0ff" stroke-width="1.5"/>
    <path d="M372 622 q25 -6 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#8fd0ff" stroke-opacity="0.5" stroke-width="1"/>
    <text x="640" y="588" fill="#8fd0ff" font-size="11" text-anchor="middle">hladina  −10,00</text>
  </g>

  <!-- osa mostu -->
  <line x1="620" y1="150" x2="620" y2="560" stroke="#cfe3ff" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="14 4 2 4"/>

  <!-- konstrukce: příhradová lávka, 8 polí po 4 m (1 m = 20 px); barva = využití, tlak plná, tah dvojitá -->
  <g stroke-linecap="butt">
    <!-- tlačené diagonály -->
    <g stroke-width="4">
      <line x1="300" y1="400" x2="380" y2="320" stroke="#ff9a4d"/>
      <line x1="860" y1="320" x2="940" y2="400" stroke="#ff9a4d"/>
      <line x1="460" y1="400" x2="540" y2="320" stroke="#ffe9a8"/>
      <line x1="700" y1="320" x2="780" y2="400" stroke="#ffe9a8"/>
    </g>
    <!-- tažené diagonály: dvojitá čára -->
    <g stroke-width="5">
      <line x1="380" y1="320" x2="460" y2="400" stroke="#ffd166"/>
      <line x1="780" y1="400" x2="860" y2="320" stroke="#ffd166"/>
      <line x1="540" y1="320" x2="620" y2="400" stroke="#ffffff"/>
      <line x1="620" y1="400" x2="700" y2="320" stroke="#ffffff"/>
    </g>
    <g stroke-width="1.6" stroke="#103f78">
      <line x1="380" y1="320" x2="460" y2="400"/><line x1="780" y1="400" x2="860" y2="320"/>
      <line x1="540" y1="320" x2="620" y2="400"/><line x1="620" y1="400" x2="700" y2="320"/>
    </g>
    <!-- svislice -->
    <g stroke-width="5" stroke="#ffffff">
      <line x1="380" y1="320" x2="380" y2="400"/><line x1="540" y1="320" x2="540" y2="400"/>
      <line x1="700" y1="320" x2="700" y2="400"/><line x1="860" y1="320" x2="860" y2="400"/>
    </g>
    <g stroke-width="1.6" stroke="#103f78">
      <line x1="380" y1="320" x2="380" y2="400"/><line x1="540" y1="320" x2="540" y2="400"/>
      <line x1="700" y1="320" x2="700" y2="400"/><line x1="860" y1="320" x2="860" y2="400"/>
    </g>
    <!-- horní pás: tlak -->
    <g stroke-width="4.5">
      <line x1="380" y1="320" x2="540" y2="320" stroke="#ff9a4d"/>
      <line x1="540" y1="320" x2="700" y2="320" stroke="#ff4d3d"/>
      <line x1="700" y1="320" x2="860" y2="320" stroke="#ff9a4d"/>
    </g>
    <!-- mostovka: tah -->
    <line x1="300" y1="400" x2="940" y2="400" stroke="#ffe9a8" stroke-width="8"/>
    <line x1="300" y1="400" x2="940" y2="400" stroke="#103f78" stroke-width="2"/>
    <line x1="140" y1="400" x2="300" y2="400" stroke="#ffffff" stroke-width="3"/>
    <line x1="940" y1="400" x2="1000" y2="400" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- styčníky -->
  <g fill="#103f78" stroke="#ffffff" stroke-width="1.8">
    <circle cx="380" cy="400" r="5"/><circle cx="460" cy="400" r="5"/><circle cx="540" cy="400" r="5"/>
    <circle cx="620" cy="400" r="5"/><circle cx="700" cy="400" r="5"/><circle cx="780" cy="400" r="5"/><circle cx="860" cy="400" r="5"/>
    <circle cx="380" cy="320" r="5"/><circle cx="540" cy="320" r="5"/><circle cx="700" cy="320" r="5"/><circle cx="860" cy="320" r="5"/>
  </g>
  <!-- podpory: pevná a posuvná -->
  <g fill="none" stroke="#cfe3ff" stroke-width="2">
    <circle cx="300" cy="400" r="6" fill="#103f78"/>
    <path d="M300 406 l-13 20 h26 z"/>
    <path d="M283 431 h34"/>
    <circle cx="940" cy="400" r="6" fill="#103f78"/>
    <path d="M940 406 l-13 20 h26 z"/>
    <circle cx="932" cy="431" r="4"/><circle cx="948" cy="431" r="4"/>
    <path d="M923 438 h34"/>
  </g>

  <!-- laděný tlumič pod středem -->
  <g stroke="#cfe3ff" fill="none" stroke-width="1.6">
    <path d="M620 405 v8 l-7 4 l14 6 l-14 6 l14 6 l-7 4 v6"/>
    <rect x="606" y="445" width="28" height="18" fill="#103f78"/>
    <path d="M606 445 l28 18 m0 -18 l-28 18" stroke-width="1"/>
  </g>
  <text x="644" y="458" fill="#cfe3ff" font-size="11">laděný tlumič 1,75 Hz · 600 kg</text>

  <!-- chodci: pochodující útvar -->
