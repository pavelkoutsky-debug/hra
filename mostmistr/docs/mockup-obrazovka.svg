  <!-- laděný tlumič pod středem -->
  <g stroke="#ffd166" fill="none" stroke-width="1.6">
    <path d="M620 405 v8 l-7 4 l14 6 l-14 6 l14 6 l-7 4 v6"/>
    <rect x="606" y="445" width="28" height="18" fill="#103f78"/>
    <path d="M606 445 l28 18 m0 -18 l-28 18" stroke-width="1"/>
  </g>
  <text x="644" y="458" fill="#ffd166" font-size="11">laděný tlumič 1,9 Hz</text>

  <!-- chodci: pochodující útvar -->
  <g stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round">
    <g id="panak">
      <circle cx="0" cy="-34" r="4"/>
      <path d="M0 -30 v15 M0 -15 l-6 15 M0 -15 l6 15 M0 -26 l-6 9 M0 -26 l6 9"/>
    </g>
    <use href="#panak" x="440" y="396"/><use href="#panak" x="462" y="396"/><use href="#panak" x="484" y="396"/>
    <use href="#panak" x="506" y="396"/><use href="#panak" x="528" y="396"/><use href="#panak" x="550" y="396"/>
    <use href="#panak" x="572" y="396"/><use href="#panak" x="594" y="396"/>
  </g>
  <text x="460" y="308" fill="#ffffff" font-size="11" text-anchor="middle">útvar 2,0 Hz →</text>

  <!-- cyklista v protisměru (vzdálenější pruh, tenčí čára) -->
  <g stroke="#cfe3ff" stroke-opacity="0.8" stroke-width="1.2" fill="none">
    <circle cx="790" cy="385" r="9"/><circle cx="818" cy="385" r="9"/>
    <path d="M790 385 l10 -14 h14 l4 14 M800 371 l8 14 M814 371 l-3 -7 h-6 M802 364 h-7"/>
    <circle cx="806" cy="352" r="3.5"/><path d="M806 356 l-2 10"/>
  </g>
  <text x="790" y="308" fill="#cfe3ff" font-size="11" text-anchor="middle">← cyklista, protisměr</text>

  <!-- dodávka na předmostí -->
  <g stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M168 388 v-26 h50 l16 12 h10 v14 h-8 M224 388 h-36 M176 388 h-8"/>
    <path d="M218 362 v12 h16"/>
    <circle cx="182" cy="390" r="7" fill="#103f78"/><circle cx="230" cy="390" r="7" fill="#103f78"/>
  </g>
  <text x="206" y="348" fill="#ffffff" font-size="11" text-anchor="middle">3,5 t →</text>

  <!-- kóty -->
  <g stroke="#cfe3ff" stroke-width="1" fill="none">
    <line x1="300" y1="440" x2="300" y2="528"/><line x1="940" y1="446" x2="940" y2="528"/>
    <line x1="302" y1="520" x2="938" y2="520" marker-start="url(#sipka)" marker-end="url(#sipka)"/>
    <line x1="866" y1="320" x2="990" y2="320"/><line x1="946" y1="400" x2="990" y2="400" stroke-opacity="0"/>
    <line x1="980" y1="322" x2="980" y2="398" marker-start="url(#sipka)" marker-end="url(#sipka)"/>
  </g>
  <rect x="580" y="510" width="80" height="18" fill="#103f78"/>
  <text x="620" y="524" fill="#cfe3ff" font-size="13" text-anchor="middle">32,00 m</text>
  <text x="992" y="364" fill="#cfe3ff" font-size="12">4,00</text>

  <!-- popisek porušení / kritického prutu -->
  <g>
    <path d="M620 318 L668 262 H800" fill="none" stroke="#ff4d3d" stroke-width="1"/>
    <circle cx="620" cy="320" r="3" fill="#ff4d3d"/>
    <text x="672" y="256" fill="#ffd0c8" font-size="12">prut 14 · vzpěr · využití 93 %</text>
  </g>

  <!-- legenda namáhání -->
  <g font-size="11" fill="#cfe3ff">
    <text x="160" y="676">TAH</text>
    <rect x="192" y="666" width="28" height="10" fill="#bfefff"/><rect x="220" y="666" width="28" height="10" fill="#7fe3ff"/><rect x="248" y="666" width="28" height="10" fill="#2fc4ff"/>
    <text x="300" y="676">TLAK</text>
    <rect x="340" y="666" width="28" height="10" fill="#ffd9a6"/><rect x="368" y="666" width="28" height="10" fill="#ffb86b"/><rect x="396" y="666" width="28" height="10" fill="#ff7a59"/><rect x="424" y="666" width="28" height="10" fill="#ff4d3d"/>
    <text x="192" y="694">0 %</text><text x="424" y="694">100 %</text>
  </g>

  <!-- analytický panel -->
  <g font-size="12" fill="#cfe3ff">
    <rect x="1024" y="54" width="248" height="470" fill="#0b2f5c" fill-opacity="0.92" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <text x="1040" y="80" font-size="11" letter-spacing="2" fill="#8fb4e6">ANALÝZA</text>

    <text x="1040" y="106" fill="#ffffff">Vlastní frekvence</text>
    <text x="1040" y="128">f1 = 1,92 Hz</text>
    <rect x="1140" y="116" width="116" height="16" fill="#ffd166"/>
    <text x="1198" y="128" fill="#0b2f5c" font-size="11" text-anchor="middle" font-weight="bold">pásmo chůze</text>
    <text x="1040" y="148">f2 = 4,81 Hz</text>
    <text x="1040" y="168">f3 = 7,35 Hz</text>
    <!-- pásmo chůze na ose -->
    <line x1="1040" y1="196" x2="1256" y2="196" stroke="#cfe3ff"/>
    <rect x="1083" y="188" width="22" height="16" fill="#ffd166" fill-opacity="0.45"/>
    <line x1="1092" y1="182" x2="1092" y2="210" stroke="#ff4d3d" stroke-width="2"/>
    <line x1="1170" y1="186" x2="1170" y2="206" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="1238" y1="186" x2="1238" y2="206" stroke="#ffffff" stroke-width="1.5"/>
    <text x="1040" y="224" font-size="10">0</text><text x="1140" y="224" font-size="10">4</text><text x="1240" y="224" font-size="10">8 Hz</text>

    <line x1="1040" y1="238" x2="1256" y2="238" stroke="#cfe3ff" stroke-opacity="0.35"/>
    <text x="1040" y="262" fill="#ffffff">Statika (vlastní tíha)</text>
    <text x="1040" y="284">Největší využití    41 %</text>
    <text x="1040" y="304">Průhyb uprostřed   18 mm</text>
    <text x="1040" y="324">Reakce A / B   96 / 96 kN</text>

    <line x1="1040" y1="338" x2="1256" y2="338" stroke="#cfe3ff" stroke-opacity="0.35"/>
    <text x="1040" y="362" fill="#ffffff">Zrychlení mostovky</text>
    <polyline fill="none" stroke="#8fd0ff" stroke-width="1.5" points="1040,420 1052,418 1064,424 1076,412 1088,430 1100,404 1112,438 1124,398 1136,442 1148,400 1160,436 1172,408 1184,430 1196,414 1208,426 1220,417 1232,423 1244,419 1256,421"/>
    <line x1="1040" y1="420" x2="1256" y2="420" stroke="#cfe3ff" stroke-opacity="0.4"/>
    <line x1="1040" y1="392" x2="1256" y2="392" stroke="#ffd166" stroke-dasharray="4 3"/>
    <text x="1256" y="386" font-size="10" fill="#ffd166" text-anchor="end">limit komfortu 1,0 m/s²</text>
    <text x="1040" y="470">Špička      0,84 m/s²</text>
    <text x="1040" y="490">Komfort     střední</text>
    <text x="1040" y="510">Bez tlumiče 3,10 m/s²</text>
  </g>

  <!-- popisové pole -->
  <g font-size="11" fill="#cfe3ff">
    <rect x="1024" y="596" width="248" height="116" fill="#103f78" stroke="#cfe3ff" stroke-width="1.5"/>
    <line x1="1024" y1="634" x2="1272" y2="634" stroke="#cfe3ff"/>
    <line x1="1024" y1="660" x2="1272" y2="660" stroke="#cfe3ff"/>
    <line x1="1024" y1="686" x2="1272" y2="686" stroke="#cfe3ff"/>
    <line x1="1148" y1="634" x2="1148" y2="712" stroke="#cfe3ff"/>
    <text x="1034" y="612" font-size="9" fill="#8fb4e6">NÁZEV</text>
    <text x="1034" y="627" fill="#ffffff" font-size="13">Lávka u jezu</text>
    <text x="1034" y="646" font-size="9" fill="#8fb4e6">MĚŘÍTKO</text><text x="1090" y="652">1 : 200</text>
    <text x="1158" y="646" font-size="9" fill="#8fb4e6">LIST</text><text x="1200" y="652">2-03</text>
    <text x="1034" y="672" font-size="9" fill="#8fb4e6">KRESLIL</text><text x="1090" y="678">hráč</text>
    <text x="1158" y="672" font-size="9" fill="#8fb4e6">HMOTNOST</text><text x="1224" y="678">19,6 t</text>
    <text x="1034" y="698" font-size="9" fill="#8fb4e6">CENA</text><text x="1076" y="704">184 500</text>
    <text x="1158" y="698" font-size="9" fill="#8fb4e6">HODNOCENÍ</text><text x="1226" y="704" fill="#ffd166">★★☆</text>
  </g>
</svg>
