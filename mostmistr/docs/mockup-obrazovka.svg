<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace">
  <title>Mostmistr – náhled obrazovky (koncept)</title>
  <defs>
    <pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="g5" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#g1)"/>
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="srafy" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cfe3ff" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
    <marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5 z" fill="#cfe3ff"/>
    </marker>
  </defs>

  <!-- výkres -->
  <rect width="1280" height="720" fill="#103f78"/>
  <rect width="1280" height="720" fill="url(#g5)"/>
  <rect x="8" y="8" width="1264" height="704" fill="none" stroke="#cfe3ff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- horní lišta -->
  <g>
    <rect x="8" y="8" width="1264" height="46" fill="#0b2f5c" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <text x="26" y="38" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="3">MOSTMISTR</text>
    <text x="180" y="37" fill="#cfe3ff" font-size="13">2-03  Lávka u jezu</text>
    <text x="420" y="37" fill="#cfe3ff" font-size="13">Rozpočet</text>
    <rect x="496" y="24" width="180" height="14" fill="none" stroke="#cfe3ff"/>
    <rect x="496" y="24" width="133" height="14" fill="#8fd0ff" fill-opacity="0.75"/>
    <text x="688" y="37" fill="#ffffff" font-size="13">184 500 / 250 000 Kč</text>
    <g font-size="13">
      <rect x="900" y="18" width="104" height="26" rx="2" fill="none" stroke="#cfe3ff"/>
      <text x="952" y="36" fill="#cfe3ff" text-anchor="middle">Analýza</text>
      <rect x="1014" y="18" width="124" height="26" rx="2" fill="#ffd166"/>
      <text x="1076" y="36" fill="#0b2f5c" text-anchor="middle" font-weight="bold">▶ Zkouška</text>
      <rect x="1148" y="18" width="110" height="26" rx="2" fill="none" stroke="#cfe3ff"/>
      <text x="1203" y="36" fill="#cfe3ff" text-anchor="middle">¼× 1× 4×</text>
    </g>
  </g>

  <!-- paleta prvků -->
  <g font-size="12" fill="#cfe3ff">
    <rect x="8" y="54" width="132" height="658" fill="#0b2f5c" fill-opacity="0.85" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <text x="22" y="78" font-size="11" letter-spacing="2" fill="#8fb4e6">PRVKY</text>
    <g>
      <rect x="18" y="88" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <line x1="26" y1="105" x2="52" y2="105" stroke="#ffffff" stroke-width="5"/>
      <text x="60" y="109">Mostovka</text>
    </g>
    <g>
      <rect x="18" y="128" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <line x1="26" y1="145" x2="52" y2="145" stroke="#e8c690" stroke-width="3"/>
      <text x="60" y="149">Dřevo</text>
    </g>
    <g>
      <rect x="18" y="168" width="112" height="34" fill="#1d5aa3" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="26" y1="185" x2="52" y2="185" stroke="#ffffff" stroke-width="3"/>
      <text x="60" y="189" fill="#ffffff">Ocel</text>
    </g>
    <g>
      <rect x="18" y="208" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <line x1="26" y1="225" x2="52" y2="225" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="5 2"/>
      <text x="60" y="229">Lano</text>
    </g>
    <g>
      <rect x="18" y="248" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="30" y="254" width="18" height="22" fill="url(#srafy)" stroke="#cfe3ff"/>
      <text x="60" y="269">Pilíř</text>
    </g>
    <g>
      <rect x="18" y="288" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <path d="M26 305h8m0-6v12m4-12v12m-4-12h10m-10 12h10m-6-6h10" fill="none" stroke="#cfe3ff" stroke-width="1.5"/>
      <text x="60" y="309">Tlumič</text>
    </g>
    <g>
      <rect x="18" y="328" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="31" y="337" width="16" height="16" fill="none" stroke="#cfe3ff" stroke-width="1.5"/>
      <path d="M31 337l16 16m0-16l-16 16" stroke="#cfe3ff" stroke-width="1"/>
      <text x="60" y="349">Závaží</text>
    </g>
    <g>
      <rect x="18" y="368" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <path d="M26 385h12m0-5h12v10h-12zm-4-7v14" fill="none" stroke="#cfe3ff" stroke-width="1.5"/>
      <text x="60" y="389">Píst</text>
    </g>
    <text x="22" y="436" font-size="11" letter-spacing="2" fill="#8fb4e6">STYČNÍK</text>
    <g>
      <rect x="18" y="446" width="112" height="34" fill="#1d5aa3" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="39" cy="463" r="6" fill="#103f78" stroke="#ffffff" stroke-width="1.5"/>
      <text x="60" y="467" fill="#ffffff">Kloub</text>
    </g>
    <g>
      <rect x="18" y="486" width="112" height="34" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
      <rect x="33" y="497" width="12" height="12" fill="#cfe3ff"/>
      <text x="60" y="507">Tuhý spoj</text>
    </g>
    <text x="22" y="554" font-size="11" letter-spacing="2" fill="#8fb4e6">NÁSTROJE</text>
    <text x="22" y="578">Mazat      Del</text>
    <text x="22" y="598">Zrcadlit     M</text>
    <text x="22" y="618">Zpět    Ctrl+Z</text>
    <text x="22" y="638">Zkouška  mezer.</text>
  </g>

  <!-- terén v řezu -->
  <g>
    <path d="M140 400 H300 L330 470 L352 600 L372 712 H140 Z" fill="url(#srafy)" stroke="#cfe3ff" stroke-width="1.5"/>
    <path d="M1000 712 L960 600 L948 470 L940 400 H1000 Z" fill="url(#srafy)" stroke="#cfe3ff" stroke-width="1.5"/>
    <!-- voda -->
    <path d="M352 600 q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 l8 0" fill="none" stroke="#8fd0ff" stroke-width="1.5"/>
    <path d="M372 622 q25 -6 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#8fd0ff" stroke-opacity="0.5" stroke-width="1"/>
    <text x="640" y="650" fill="#8fd0ff" font-size="11" text-anchor="middle">hladina  −10,00</text>
  </g>

  <!-- osa mostu -->
  <line x1="620" y1="150" x2="620" y2="560" stroke="#cfe3ff" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="14 4 2 4"/>

  <!-- konstrukce: příhradová lávka, 8 polí po 4 m (1 m = 20 px) -->
  <g stroke-linecap="round">
    <!-- diagonály a svislice obarvené podle namáhání -->
    <g stroke-width="3.5">
      <line x1="300" y1="400" x2="380" y2="320" stroke="#ff7a59"/>
      <line x1="380" y1="320" x2="460" y2="400" stroke="#7fe3ff"/>
      <line x1="460" y1="400" x2="540" y2="320" stroke="#ffb86b"/>
      <line x1="540" y1="320" x2="620" y2="400" stroke="#bfefff"/>
      <line x1="620" y1="400" x2="700" y2="320" stroke="#bfefff"/>
      <line x1="700" y1="320" x2="780" y2="400" stroke="#ffb86b"/>
      <line x1="780" y1="400" x2="860" y2="320" stroke="#7fe3ff"/>
      <line x1="860" y1="320" x2="940" y2="400" stroke="#ff7a59"/>
      <line x1="380" y1="320" x2="380" y2="400" stroke="#e6eefc"/>
      <line x1="540" y1="320" x2="540" y2="400" stroke="#e6eefc"/>
      <line x1="700" y1="320" x2="700" y2="400" stroke="#e6eefc"/>
      <line x1="860" y1="320" x2="860" y2="400" stroke="#e6eefc"/>
    </g>
    <!-- horní pás: tlak -->
