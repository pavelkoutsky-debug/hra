<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'DejaVu Sans Mono','Consolas','Courier New',monospace">
  <title>Mostmistr – náhled obrazovky (koncept v0.2)</title>
  <defs>
    <pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="g5" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#g1)"/>
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="srafy" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cfe3ff" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
    <marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5 z" fill="#cfe3ff"/>
    </marker>
  </defs>

  <!-- výkres -->
