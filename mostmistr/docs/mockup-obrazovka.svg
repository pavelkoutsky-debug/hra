    <g id="panak">
      <circle cx="0" cy="-34" r="4"/>
      <path d="M0 -30 v15 M0 -15 l-6 15 M0 -15 l6 15 M0 -26 l-6 9 M0 -26 l6 9"/>
    </g>
    <use href="#panak" x="440" y="395"/><use href="#panak" x="462" y="395"/><use href="#panak" x="484" y="395"/>
    <use href="#panak" x="506" y="395"/><use href="#panak" x="528" y="395"/><use href="#panak" x="550" y="395"/>
    <use href="#panak" x="572" y="395"/><use href="#panak" x="594" y="395"/>
  </g>
  <text x="460" y="308" fill="#ffffff" font-size="11" text-anchor="middle">útvar 2,0 Hz →</text>

  <!-- běžci na předmostí -->
  <g stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round">
    <g id="bezec">
      <circle cx="3" cy="-34" r="4"/>
      <path d="M2 -30 l-3 14 M-1 -16 l8 6 l-2 10 M-1 -16 l-7 7 l-6 3 M1 -27 l8 3 l5 -4 M1 -27 l-8 4 l-2 7"/>
    </g>
    <use href="#bezec" x="176" y="398"/><use href="#bezec" x="206" y="398"/><use href="#bezec" x="236" y="398"/>
  </g>
  <text x="206" y="348" fill="#ffffff" font-size="11" text-anchor="middle">běžci 2,8 Hz →</text>

  <!-- cyklista v protisměru (vzdálenější pruh, tenčí čára) -->
  <g stroke="#cfe3ff" stroke-opacity="0.8" stroke-width="1.2" fill="none">
    <circle cx="790" cy="385" r="9"/><circle cx="818" cy="385" r="9"/>
    <path d="M790 385 l10 -14 h14 l4 14 M800 371 l8 14 M814 371 l-3 -7 h-6 M802 364 h-7"/>
    <circle cx="806" cy="352" r="3.5"/><path d="M806 356 l-2 10"/>
  </g>
  <text x="790" y="308" fill="#cfe3ff" font-size="11" text-anchor="middle">← cyklista, protisměr</text>

  <!-- kóty -->
  <g stroke="#cfe3ff" stroke-width="1" fill="none">
    <line x1="300" y1="440" x2="300" y2="528"/><line x1="940" y1="446" x2="940" y2="528"/>
    <line x1="302" y1="520" x2="938" y2="520" marker-start="url(#sipka)" marker-end="url(#sipka)"/>
    <line x1="866" y1="320" x2="990" y2="320"/>
    <line x1="980" y1="322" x2="980" y2="398" marker-start="url(#sipka)" marker-end="url(#sipka)"/>
  </g>
  <rect x="580" y="510" width="80" height="18" fill="#103f78"/>
  <text x="620" y="524" fill="#cfe3ff" font-size="13" text-anchor="middle">32,00 m</text>
  <text x="992" y="364" fill="#cfe3ff" font-size="12">4,00</text>

  <!-- obálka: kritický prut s časem -->
  <g>
    <path d="M620 318 L668 262 H876" fill="none" stroke="#ff4d3d" stroke-width="1"/>
    <circle cx="620" cy="320" r="3" fill="#ff4d3d"/>
    <text x="672" y="256" fill="#ffd0c8" font-size="12">prut 14 · vzpěr · 93 % · čas 0:31</text>
  </g>

  <!-- časová osa zkoušky -->
  <g font-size="10" fill="#cfe3ff">
    <rect x="150" y="656" width="864" height="52" fill="#0b2f5c" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <!-- spočítaná část -->
    <rect x="160" y="690" width="640" height="6" fill="#8fd0ff" fill-opacity="0.55"/>
    <rect x="800" y="690" width="204" height="6" fill="none" stroke="#cfe3ff" stroke-opacity="0.5"/>
    <text x="808" y="705" fill="#8fb4e6">počítá se…</text>
    <!-- události jízdního řádu -->
    <rect x="160" y="664" width="200" height="16" fill="none" stroke="#cfe3ff"/>
    <text x="260" y="676" text-anchor="middle">útvar 1,7 Hz</text>
    <rect x="368" y="664" width="200" height="16" fill="#1d5aa3" stroke="#ffffff"/>
    <text x="468" y="676" text-anchor="middle" fill="#ffffff">útvar 2,0 Hz</text>
    <rect x="576" y="664" width="150" height="16" fill="none" stroke="#cfe3ff"/>
    <text x="651" y="676" text-anchor="middle">běžci 2,8 Hz</text>
    <rect x="734" y="664" width="270" height="16" fill="none" stroke="#cfe3ff"/>
    <text x="869" y="676" text-anchor="middle">dav 120 lidí</text>
    <!-- značka největšího využití a ukazatel přehrávání -->
    <path d="M470 688 l-5 -7 h10 z" fill="#ff4d3d"/>
    <line x1="470" y1="660" x2="470" y2="704" stroke="#ffffff" stroke-width="2"/>
    <text x="476" y="705" fill="#ffffff">0:31</text>
    <text x="160" y="705">0:00</text>
    <text x="1004" y="705" text-anchor="end">1:24</text>
  </g>

  <!-- analytický panel -->
  <g font-size="12" fill="#cfe3ff">
    <rect x="1024" y="54" width="248" height="470" fill="#0b2f5c" fill-opacity="0.92" stroke="#cfe3ff" stroke-opacity="0.6"/>
    <text x="1040" y="80" font-size="11" letter-spacing="2" fill="#8fb4e6">ANALÝZA</text>

    <text x="1040" y="106" fill="#ffffff">Vlastní frekvence</text>
    <text x="1040" y="128">f1 = 1,92 Hz</text>
    <rect x="1140" y="116" width="116" height="16" fill="#ffd166"/>
    <text x="1198" y="128" fill="#0b2f5c" font-size="11" text-anchor="middle" font-weight="bold">pásmo chůze</text>
    <text x="1040" y="148">s lidmi  1,74 Hz</text>
    <text x="1040" y="168">f2 = 4,81 Hz</text>

    <!-- rezonanční křivka: bez tlumiče a s tlumičem -->
    <rect x="1083" y="182" width="43" height="54" fill="#ffd166" fill-opacity="0.22"/>
    <polyline fill="none" stroke="#cfe3ff" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="3 2" points="1040,232 1070,230 1084,224 1092,206 1096,186 1100,206 1108,224 1124,230 1160,232 1256,233"/>
    <polyline fill="none" stroke="#ffffff" stroke-width="1.6" points="1040,232 1070,230 1082,224 1088,214 1092,222 1096,226 1100,222 1104,214 1110,224 1124,230 1160,232 1256,233"/>
    <line x1="1040" y1="236" x2="1256" y2="236" stroke="#cfe3ff"/>
    <text x="1040" y="250" font-size="10">0</text><text x="1140" y="250" font-size="10">4</text><text x="1236" y="250" font-size="10">8 Hz</text>
    <text x="1256" y="196" font-size="10" text-anchor="end">- - bez tlumiče</text>
    <text x="1256" y="210" font-size="10" text-anchor="end" fill="#ffffff">— s tlumičem</text>

    <line x1="1040" y1="262" x2="1256" y2="262" stroke="#cfe3ff" stroke-opacity="0.35"/>
    <text x="1040" y="284" fill="#ffffff">Statika (vlastní tíha)</text>
    <text x="1040" y="304">Největší využití    41 %</text>
    <text x="1040" y="324">Průhyb uprostřed   18 mm</text>
    <text x="1040" y="344">Reakce A / B   96 / 96 kN</text>

    <line x1="1040" y1="358" x2="1256" y2="358" stroke="#cfe3ff" stroke-opacity="0.35"/>
    <text x="1040" y="380" fill="#ffffff">Zrychlení mostovky</text>
    <polyline fill="none" stroke="#8fd0ff" stroke-width="1.5" points="1040,432 1052,430 1064,436 1076,424 1088,442 1100,416 1112,450 1124,410 1136,454 1148,412 1160,448 1172,420 1184,442 1196,426 1208,438 1220,429 1232,435 1244,431 1256,433"/>
    <line x1="1040" y1="432" x2="1256" y2="432" stroke="#cfe3ff" stroke-opacity="0.4"/>
    <line x1="1040" y1="404" x2="1256" y2="404" stroke="#cfe3ff" stroke-dasharray="4 3"/>
    <text x="1256" y="399" font-size="10" text-anchor="end">limit komfortu 1,0 m/s²</text>
    <text x="1040" y="476">Největší    0,84 m/s²</text>
    <text x="1040" y="494">Komfort     střední</text>
    <text x="1040" y="512">Minule      3,10 m/s²</text>
  </g>

  <!-- popisové pole -->
