# Mostmistr — nasazení na Netlify.
# V Netlify nastav „Base directory“ na `mostmistr`; cesty níže jsou relativní k ní.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Funkce: příjem zpětné vazby a deníku hraní a správa (viz src/server/). Ukládají do Netlify Blobs.
# Heslo správce je proměnná prostředí MM_SPRAVCE_HESLO nastavená v Netlify, v repozitáři není.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Bezpečnostní hlavičky pro všechny cesty. Totéž posílá náhledový server Vite při testech
# v prohlížeči (`hlavicky.ts`); že se obojí shoduje, hlídá `test/hlavicky.test.ts`.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Soubory s otiskem v názvu se nemění: smějí zůstat v mezipaměti napořád.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stránky se při každém načtení ověří u serveru, aby hráč po nasazení dostal novou verzi
# (a s ní nové názvy souborů v /assets/). Mezipaměť není v bloku "/*", protože hlavičky
# shodných pravidel se na Netlify slučují a /assets/* má zůstat immutable.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/zkusebna.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mereni.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/otisky.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/zvuky.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sprava.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
