# Mostmistr — nasazení na Netlify.
# V Netlify nastav „Base directory“ na `mostmistr`; cesty níže jsou relativní k ní.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
